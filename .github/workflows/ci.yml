name: CI

# Runs lint + unit tests + a production build on every push and PR, so a
# regression (or a broken build) is caught before it can reach real creators.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Build only needs these to be present; the values are public anyway.
          VITE_SUPABASE_URL: https://heuhqqoxyggawuckxocp.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # The edge functions run on Deno, not Node, and are deployed by hand. Type-check every one and run their tests under
  # Deno itself (the same files `npm test` runs with vitest; deno_test_imports.json maps `vitest` onto Deno's std lib).
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every function
        run: deno check --no-lock --node-modules-dir=none supabase/functions/*/index.ts
      - name: Edge function tests
        run: deno test --no-lock --node-modules-dir=none --import-map=supabase/functions/deno_test_imports.json supabase/functions

  # Does what is DEPLOYED match the repo? Read-only. Needs the repository secret SUPABASE_ACCESS_TOKEN (a Supabase
  # personal access token with read access to the project); without it the job says so and passes.
  edge-drift:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Compare deployed functions with the repo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'heuhqqoxyggawuckxocp' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so the drift check was skipped. See docs/MOVING_TO_TRYP_INFRASTRUCTURE.md."
            exit 0
          fi
          ./scripts/edge-drift.sh
