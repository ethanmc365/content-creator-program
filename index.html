<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- THE CANVAS IS WHITE BEFORE ANYTHING ELSE IN THIS FILE IS READ.
         First rule in the document on purpose. Whatever the browser paints
         first - the root background during a reload, the overscroll gutter, the
         gap while the boot layer is still being parsed - is this colour, and it
         is the SAME colour as the boot layer and as the app behind it. That
         sameness is the whole point: the orange splash this replaced could not
         avoid a seam, because the document's own canvas is painted before any
         layer is, so a coloured layer over a differently-coloured canvas always
         has one frame where they disagree. See vite-boot-css.js for the other
         half of this, which is what stops the app opening UNSTYLED. -->
    <style>html { background: #ffffff; }</style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <!-- Mobile-first viewport. viewport-fit=cover handles iPhone notch/safe areas.

         `user-scalable=no, maximum-scale=1` DISABLES THE BROWSER'S OWN PINCH
         ZOOM. Ethan: "zoom in feature on mobile should not happen across the
         platform, only for certain things such as zooming in on the maps,
         zooming in on photos." Those two do their own zooming in JS now, at a
         quality browser zoom cannot reach - the map draws MORE map rather than
         bigger pixels - so what this removes is only the accidental version,
         which strands a chat thread at 1.3x with no way back.

         It is honoured in a standalone (home-screen) window and ignored by iOS
         Safari in a tab, which is why lib/pinchGuard exists as well. Neither is
         sufficient on its own. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta
      name="description"
      content="The official Tryp.com Content Creator Community. Create travel content, compete in challenges, earn cash and travel vouchers."
    />

    <!-- Social link preview (Open Graph + Twitter Card)

         COMMUNITY, NOT PROGRAM, AND THE CARD IS THE LOGO (4 Sep 2026).

         Ethan: "whenever you're sharing it there's that preview card that shows
         up - if you're sharing on Instagram for example. It currently shows
         Tryp.com Content Creator Program. Can you change that to just the
         Tryp.com logo there? And rename Tryp.com Content Creator Program as
         Tryp.com Content Creator Community."

         The old card carried the wordmark AND "Content Creator Program" set
         underneath it, so the name appeared twice in a preview that also prints
         the title as text beside it - three copies of the same words in one
         card. `og-image-v3.png` is the wordmark alone on the brand orange.

         THE FILENAME IS VERSIONED, and that is the point of it rather than
         tidiness: every scraper that has ever fetched this link - Instagram,
         WhatsApp, Slack, iMessage - has the old bytes cached against the old
         URL, some of them for weeks. Overwriting `og-image-v2.png` would leave
         the old card showing everywhere it already appears.

         The URLs point at `trypcreators.vercel.app`, which is the canonical
         origin (see lib/canonicalHost). The other origin still serves the app;
         it is just not the one to advertise. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tryp.com" />
    <meta property="og:title" content="Tryp.com Content Creator Community" />
    <meta property="og:description" content="The official Tryp.com Content Creator Community. Create travel content, compete in challenges, earn cash and travel vouchers." />
    <meta property="og:url" content="https://trypcreators.vercel.app" />
    <meta property="og:image" content="https://trypcreators.vercel.app/og-image-v3.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tryp.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tryp.com Content Creator Community" />
    <meta name="twitter:description" content="Create travel content, compete in challenges, earn cash and travel vouchers." />
    <meta name="twitter:image" content="https://trypcreators.vercel.app/og-image-v3.png" />

    <!-- Add to Home Screen (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#d94407" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v4.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tryp.com" />

    <!-- THE WORLD MAP, FETCHED BEFORE ANYTHING ASKS FOR IT.
         Six pages carry a map and all of them defer the map's mount until it is
         nearly on screen, which is right for the render and wrong for the
         download - the file only started moving once a reader was already
         looking at where it should be. `prefetch` is the low-priority hint:
         the browser takes it when the network is otherwise idle, so it never
         competes with the bundle or the first queries, and by the time anybody
         scrolls to a map it is a cache hit. See lib/mapCountries.

         NO `crossorigin` ATTRIBUTE. It is same-origin, and adding it would make
         the prefetch a CORS request while `loadMapFeatures` does a plain
         same-origin `fetch` - two different cache keys for the same URL, so the
         prefetched copy would never be used and the file would be downloaded
         twice. -->
    <link rel="prefetch" href="/geo/countries-50m.json" as="fetch" />

    <title>Tryp.com Creator Community</title>
  </head>
  <body>
    <!-- THE FIRST FRAME IS THE LOADER THE APP ITSELF DRAWS.
         Everything below this line is inline on purpose. Between the browser
         painting the document and React mounting there is a gap - the bundle
         has to arrive and parse - and for that gap `#root` is empty.

         THIS IS A COPY OF `PlaneLoader` (components/ui), DELIBERATELY, DOWN TO
         THE NUMBERS. A full-orange splash was tried and rejected: it flashed
         white, then orange, then the app, because three different surfaces
         (the document canvas, the splash layer, the app) were three different
         colours and the browser paints them at three different moments. Ethan:
         "it still flashes white and then orange... just revert it to what
         originally was, the white screen with one animated icon showing that
         it's loading." So there is now ONE look, drawn twice - once here in
         plain HTML for the gap, once by React afterwards - and the handover
         between them is invisible because there is nothing to hand over.

         KEEP THE TWO IN STEP. 112px strip (w-28), 32px tall (h-8), a 24px
         plane (h-6 w-6) on a 2px dashed line at 25% brand, `fly` at 1.7s
         ease-in-out with the exact -130%/210% travel from tailwind.config.
         If PlaneLoader changes, change this.

         It cannot be an external stylesheet or a script: this has to be
         paintable from the HTML alone, on the very first frame, with nothing
         fetched. It is removed by main.jsx once React has rendered. -->
    <style>
      /* THE FIRST FRAME IS THE SHAPE OF THE APP, NOT A LOADING SCREEN.

         Ethan, for the sixth time and this time about the installed app: "I'm
         still having the issue where it flashes up the loading screen between
         clicks. I don't want a loading screen, only the skeleton layout
         loading."

         Every loader INSIDE the app is a skeleton now (see lib/pageCache and
         components/PageSkeleton), and this was the last screen in the product
         that was not: a white page with a flying plane and the word "Loading".
         It matters far more on the home-screen app than in a browser, because
         iOS kills a backgrounded PWA aggressively - so what is a rare cold boot
         on a laptop is something a creator meets several times an hour on a
         phone, in between doing other things, which is exactly what "between
         clicks" describes.

         So this draws the SHELL: the header bar, a page of card shapes, and the
         bottom tab strip, in the same greys and with the same shimmer as
         `.skeleton` in index.css. The app then renders its own skeleton in the
         same places and hands over to real content, and there is no third
         screen anywhere in the sequence.

         It cannot be an external stylesheet or a script: this has to be
         paintable from the HTML alone, on the very first frame, with nothing
         fetched. It is removed by main.jsx once React has something to show.
         IF PageSkeleton'S SHAPES CHANGE, CHANGE THIS. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
        /* The fade out. `visibility` rides along so the layer stops taking
           presses the instant it starts leaving, rather than 420ms later.
           NO SCALE, and no colour change: the layer is the same white as the
           page under it, so all that is left to do is stop being there.

           160ms, AND THE NUMBER IS LOAD-BEARING (9 Sep 2026). Ethan: "we were
           supposed to have those cool animations of Create, Earn and Travel,
           and everything floats in nicely. But we still don't have that. It
           shows the loading screen for ages and then it just flashes up
           solidly."

           `releaseBootLayer()` and `classList.add('gone')` happen on the SAME
           line of main.jsx, so the landing page unpauses its entrance at the
           instant this layer begins to leave - and at 300ms that meant the
           first HALF of a 620ms word animation played behind an opaque white
           sheet. What was left to see was a word already most of the way in,
           arriving abruptly. That is the same bug the boot layer caused
           before, one order of magnitude smaller: an animation that runs
           perfectly where nobody can see it.

           At 160ms the two genuinely cross-fade. The word is still near
           invisible on its own account while the sheet is still mostly opaque,
           so nothing is lost behind it, and by the time the sheet is gone the
           entrance is barely a quarter through. */
        transition: opacity 160ms ease-out, visibility 160ms ease-out;
      }
      #boot.gone { opacity: 0; visibility: hidden; }

      /* NOTHING FROM THE APP'S STYLESHEET REACHES IN HERE, AND IT USED TO
         (9 Sep 2026). Ethan, on his own iPhone: "the two buttons have these
         really big dark outline bars around them in black, that looks really
         odd."

         This layer's classes were bare words - `.btn`, `.page`, `.hero`,
         `.row`, `.col`, `.nav` - and `index.css` owns `.btn` and `.page` for
         real. The moment the app's stylesheet finished loading it began
         restyling the SKELETON: `.btn` handed the two button shapes
         `display: inline-flex` and `.75rem 1.5rem` of padding, and `.page`
         handed the whole block a `page-in` ANIMATION and 2rem of padding, so
         the placeholder moved and re-drew underneath the real page.

         Two changes, and the second is the one that makes it impossible rather
         than merely fixed. Every class is prefixed `b-` now, and the layer
         carries its own reset - so a future utility called `.b-btn` would
         still lose to these rules, which are all `#boot`-scoped and therefore
         a whole id more specific than anything Tailwind can generate.

         `revert-layer` is deliberately NOT used: it is exactly the wrong tool,
         because the app's rules and these are in the same origin. Naming the
         properties is longer and correct. */
      #boot,
      #boot * {
        margin: 0;
        padding: 0;
        border: 0;
        outline: 0;
        box-shadow: none;
        animation-name: none;
        font: inherit;
        text-decoration: none;
        list-style: none;
        box-sizing: border-box;
      }
      /* One grey block. */
      #boot i {
        display: block;
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        background: #F4F4F5;
      }
      #boot i::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        animation: boot-shimmer 1.6s ease-in-out infinite;
      }
      @keyframes boot-shimmer { 100% { transform: translateX(100%); } }

      /* The header: a logo block on the left, two round controls on the right.
         64px tall and a hairline underneath, which is what AppLayout draws. */
      #boot .b-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: 64px;
        padding: 0 20px;
        border-bottom: 1px solid #F3F4F6;
        flex: 0 0 auto;
      }
      #boot .b-bar .b-logo { width: 84px; height: 34px; border-radius: 10px; }
      #boot .b-bar .b-side { display: flex; align-items: center; gap: 10px; }
      #boot .b-bar .b-side i { width: 34px; height: 34px; border-radius: 999px; }

      /* The page. A heading, a wide card, then two rows - the shape every one
         of PageSkeleton's layouts starts with. */
      #boot .b-page {
        flex: 1 1 auto;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 20px 0;
        box-sizing: border-box;
      }
      #boot .b-page .b-h1 { width: 190px; height: 32px; border-radius: 10px; }
      #boot .b-page .b-h2 { width: 260px; max-width: 70%; height: 16px; margin-top: 12px; }
      #boot .b-page .b-hero { width: 100%; height: 132px; border-radius: 20px; margin-top: 26px; }
      #boot .b-page .b-row { width: 100%; height: 68px; border-radius: 16px; margin-top: 12px; }
      #boot .b-page .b-row.b-b { width: 92%; }

      /* The bottom tab strip, phone only - five items above the home indicator. */
      #boot .b-tabs {
        display: flex;
        justify-content: space-around;
        align-items: center;
        gap: 4px;
        padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid #F3F4F6;
        flex: 0 0 auto;
      }
      #boot .b-tabs i { width: 26px; height: 26px; border-radius: 9px; }
      @media (min-width: 1024px) {
        #boot .b-tabs { display: none; }
        #boot .b-page { padding-top: 36px; }
      }

      /* ------------------------------------------------------------------
         THE FRONT PAGE IS NOT THE APP, AND IT WAS BEING DRAWN AS THE APP.

         Ethan (9 Sep 2026): "for the initial loading, whenever you refresh, it
         shows up the skeleton cards, but the skeleton cards for the actual
         worldwide page, not for the landing page, which is weird. Maybe have
         proper skeleton cards for the landing page - they should be different
         for each one."

         Exactly right, and it was worse than a wrong shape. The shell above is
         a signed-in creator's screen: an application header, a stack of card
         rows and A BOTTOM TAB BAR. A stranger arriving at tryp.com was shown
         five phone tabs they do not have, on a page that has none, and then the
         public marketing page faded in behind it.

         It also swallowed the hero animation, which is the OTHER half of the
         same report ("Create. Earn. Travel. - there's still no animation there,
         it just loads in"). The words animate the moment React commits, which
         on a phone is comfortably inside the life of this layer, so the whole
         entrance played underneath an opaque white sheet. Both halves are one
         bug: this layer did not know which page was coming.

         `#boot.b-public` is the shape of the PUBLIC page - the floating nav pill,
         a centred headline, a paragraph, two stacked buttons, one stats band -
         and it is set by the inline script below from the path, which is the
         only thing known before any JavaScript module has been fetched.
         `src/pages/Landing.jsx` then waits for this layer to leave before it
         starts its entrance. IF THE LANDING LAYOUT CHANGES, CHANGE THIS. */
      #boot.b-public .b-bar,
      #boot.b-public .b-tabs,
      #boot.b-public .b-page { display: none; }
      #boot.b-public .b-public { display: block; }
      #boot .b-public { display: none; flex: 1 1 auto; }

      /* The floating nav pill: inset from the edges, nothing spanning the full
         width, which is what the real header does over the hero. */
      #boot .b-public .b-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        max-width: 1024px;
        margin: 0 auto;
        height: 56px;
        padding: 0 20px;
        box-sizing: border-box;
      }
      #boot .b-public .b-nav .b-mark { width: 92px; height: 34px; border-radius: 10px; }
      #boot .b-public .b-nav .b-side { display: flex; align-items: center; gap: 8px; }
      #boot .b-public .b-nav .b-side i { width: 62px; height: 36px; border-radius: 999px; }
      #boot .b-public .b-nav .b-side i.b-cta { width: 88px; }

      /* The hero. Centred, because the real one is - a left-aligned skeleton
         under a centred headline is a layout that moves when the page lands. */
      #boot .b-public .b-hero {
        max-width: 640px;
        margin: 0 auto;
        padding: 32px 20px 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #boot .b-public .b-hero i.b-t { width: 100%; height: 44px; border-radius: 12px; }
      #boot .b-public .b-hero i.b-t2 { width: 62%; }
      #boot .b-public .b-hero i.b-p { width: 92%; height: 14px; margin-top: 10px; }
      #boot .b-public .b-hero i.b-p2 { width: 84%; margin-top: 0; }
      #boot .b-public .b-hero i.b-p3 { width: 66%; margin-top: 0; }
      #boot .b-public .b-hero i.b-btn {
        width: 100%;
        max-width: 320px;
        height: 52px;
        border-radius: 999px;
        margin-top: 14px;
      }
      #boot .b-public .b-hero i.b-btn.b-b { margin-top: 0; }

      /* The stats band. A tinted strip with three centred columns, which is
         what sits directly under the hero on the real page. */
      #boot .b-public .b-band {
        margin-top: 40px;
        padding: 34px 20px;
        background: #FAFAFA;
        border-top: 1px solid #F3F4F6;
        border-bottom: 1px solid #F3F4F6;
      }
      #boot .b-public .b-band .b-cols {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        max-width: 720px;
        margin: 0 auto;
      }
      #boot .b-public .b-band .b-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      #boot .b-public .b-band .b-col i.b-n { width: 68%; height: 30px; border-radius: 10px; }
      #boot .b-public .b-band .b-col i.b-l { width: 88%; height: 12px; }

      @media (min-width: 640px) {
        #boot .b-public .b-nav { height: 72px; padding: 0 28px; }
        #boot .b-public .b-hero { max-width: 760px; padding-top: 92px; gap: 16px; }
        #boot .b-public .b-hero i.b-t { height: 66px; }
        #boot .b-public .b-hero i.b-btn { max-width: 220px; }
        #boot .b-public .b-band .b-col i.b-n { height: 46px; }
      }

      /* Somebody who has asked for less motion gets the shapes without the
         sweep - "something is happening" is carried by the layout itself. */
      @media (prefers-reduced-motion: reduce) {
        #boot i::after { animation: none; }
      }

      /* Dark mode: the same shapes on the app's own dark canvas, or the layer
         is a white flash in front of a dark app. */
      @media (prefers-color-scheme: dark) {
        html[data-theme='dark'] #boot { background: #141416; }
        html[data-theme='dark'] #boot i { background: #232326; }
        html[data-theme='dark'] #boot .b-bar,
        html[data-theme='dark'] #boot .b-tabs { border-color: #232326; }
      }
    </style>
    <div id="boot" role="status" aria-label="Loading Tryp.com">
      <div class="b-bar">
        <i class="b-logo"></i>
        <span class="b-side"><i></i><i></i></span>
      </div>
      <div class="b-page">
        <i class="b-h1"></i>
        <i class="b-h2"></i>
        <i class="b-hero"></i>
        <i class="b-row"></i>
        <i class="b-row b-b"></i>
        <i class="b-row"></i>
      </div>
      <div class="b-tabs">
        <i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="b-public">
        <div class="b-nav">
          <i class="b-mark"></i>
          <span class="b-side"><i></i><i class="b-cta"></i></span>
        </div>
        <div class="b-hero">
          <i class="b-t"></i>
          <i class="b-t b-t2"></i>
          <i class="b-p"></i>
          <i class="b-p b-p2"></i>
          <i class="b-p b-p3"></i>
          <i class="b-btn"></i>
          <i class="b-btn b-b"></i>
        </div>
        <div class="b-band">
          <div class="b-cols">
            <span class="b-col"><i class="b-n"></i><i class="b-l"></i></span>
            <span class="b-col"><i class="b-n"></i><i class="b-l"></i></span>
            <span class="b-col"><i class="b-n"></i><i class="b-l"></i></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      /* WHICH SHAPE, DECIDED FROM THE PATH, BEFORE ANY MODULE IS FETCHED.
         Inline and synchronous on purpose: this runs in the same parse as the
         markup above, so the layer is never painted with the wrong shape even
         for one frame. ONLY THE FRONT PAGE: /login and /signup are a different
         layout again and would need a third shape rather than this one, and
         being confidently wrong is the thing this is fixing. A `?demo=1`
         preview of the landing page inside the Testing Centre is on
         /admin/testing and correctly gets the shell. */
      (function () {
        try {
          if ((location.pathname.replace(/\/+$/, '') || '/') === '/') {
            document.getElementById('boot').className = 'b-public'
          }
        } catch (e) { /* the shell is the safe default */ }
      })()
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
