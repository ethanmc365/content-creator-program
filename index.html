<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- THE CANVAS IS WHITE BEFORE ANYTHING ELSE IN THIS FILE IS READ.
         First rule in the document on purpose. Whatever the browser paints
         first - the root background during a reload, the overscroll gutter, the
         gap while the boot layer is still being parsed - is this colour, and it
         is the SAME colour as the boot layer and as the app behind it. That
         sameness is the whole point: the orange splash this replaced could not
         avoid a seam, because the document's own canvas is painted before any
         layer is, so a coloured layer over a differently-coloured canvas always
         has one frame where they disagree. See vite-boot-css.js for the other
         half of this, which is what stops the app opening UNSTYLED. -->
    <style>html { background: #ffffff; }</style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <!-- Mobile-first viewport. viewport-fit=cover handles iPhone notch/safe areas.

         `user-scalable=no, maximum-scale=1` DISABLES THE BROWSER'S OWN PINCH
         ZOOM. Ethan: "zoom in feature on mobile should not happen across the
         platform, only for certain things such as zooming in on the maps,
         zooming in on photos." Those two do their own zooming in JS now, at a
         quality browser zoom cannot reach - the map draws MORE map rather than
         bigger pixels - so what this removes is only the accidental version,
         which strands a chat thread at 1.3x with no way back.

         It is honoured in a standalone (home-screen) window and ignored by iOS
         Safari in a tab, which is why lib/pinchGuard exists as well. Neither is
         sufficient on its own. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta
      name="description"
      content="The official Tryp.com Content Creator Program. Create travel content, compete in challenges, earn cash and travel vouchers."
    />

    <!-- Social link preview (Open Graph + Twitter Card) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tryp.com" />
    <meta property="og:title" content="Tryp.com Content Creator Program" />
    <meta property="og:description" content="The official Tryp.com Content Creator Program. Create travel content, compete in challenges, earn cash and travel vouchers." />
    <meta property="og:url" content="https://content-creator-program.vercel.app" />
    <meta property="og:image" content="https://content-creator-program.vercel.app/og-image-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tryp.com Content Creator Program" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tryp.com Content Creator Program" />
    <meta name="twitter:description" content="Create travel content, compete in challenges, earn cash and travel vouchers." />
    <meta name="twitter:image" content="https://content-creator-program.vercel.app/og-image-v2.png" />

    <!-- Add to Home Screen (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#d94407" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v4.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tryp.com" />

    <!-- THE WORLD MAP, FETCHED BEFORE ANYTHING ASKS FOR IT.
         Six pages carry a map and all of them defer the map's mount until it is
         nearly on screen, which is right for the render and wrong for the
         download - the file only started moving once a reader was already
         looking at where it should be. `prefetch` is the low-priority hint:
         the browser takes it when the network is otherwise idle, so it never
         competes with the bundle or the first queries, and by the time anybody
         scrolls to a map it is a cache hit. See lib/mapCountries.

         NO `crossorigin` ATTRIBUTE. It is same-origin, and adding it would make
         the prefetch a CORS request while `loadMapFeatures` does a plain
         same-origin `fetch` - two different cache keys for the same URL, so the
         prefetched copy would never be used and the file would be downloaded
         twice. -->
    <link rel="prefetch" href="/geo/countries-50m.json" as="fetch" />

    <title>Tryp.com Creator Program</title>
  </head>
  <body>
    <!-- THE FIRST FRAME IS THE LOADER THE APP ITSELF DRAWS.
         Everything below this line is inline on purpose. Between the browser
         painting the document and React mounting there is a gap - the bundle
         has to arrive and parse - and for that gap `#root` is empty.

         THIS IS A COPY OF `PlaneLoader` (components/ui), DELIBERATELY, DOWN TO
         THE NUMBERS. A full-orange splash was tried and rejected: it flashed
         white, then orange, then the app, because three different surfaces
         (the document canvas, the splash layer, the app) were three different
         colours and the browser paints them at three different moments. Ethan:
         "it still flashes white and then orange... just revert it to what
         originally was, the white screen with one animated icon showing that
         it's loading." So there is now ONE look, drawn twice - once here in
         plain HTML for the gap, once by React afterwards - and the handover
         between them is invisible because there is nothing to hand over.

         KEEP THE TWO IN STEP. 112px strip (w-28), 32px tall (h-8), a 24px
         plane (h-6 w-6) on a 2px dashed line at 25% brand, `fly` at 1.7s
         ease-in-out with the exact -130%/210% travel from tailwind.config.
         If PlaneLoader changes, change this.

         It cannot be an external stylesheet or a script: this has to be
         paintable from the HTML alone, on the very first frame, with nothing
         fetched. It is removed by main.jsx once React has rendered. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #ffffff;
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
        /* The fade out. `visibility` rides along so the layer stops taking
           presses the instant it starts leaving, rather than 420ms later.
           NO SCALE, and no colour change: the layer is the same white as the
           page under it, so all that is left to do is stop being there. */
        transition: opacity 300ms ease-out, visibility 300ms ease-out;
      }
      #boot.gone { opacity: 0; visibility: hidden; }
      #boot .strip {
        position: relative;
        display: flex;
        align-items: center;
        width: 112px;
        height: 32px;
        overflow: hidden;
      }
      #boot .line {
        position: absolute;
        left: 0; right: 0; top: 50%;
        border-top: 2px dashed rgba(217, 68, 7, 0.25);
      }
      #boot svg {
        position: relative;
        width: 24px;
        height: 24px;
        color: #d94407;
        animation: boot-fly 1.7s ease-in-out infinite;
      }
      #boot .label {
        font-size: 0.875rem;
        font-weight: 500;
        color: #6B7280;
      }
      @keyframes boot-fly {
        0%   { transform: translateX(-130%); opacity: 0; }
        15%  { opacity: 1; }
        85%  { opacity: 1; }
        100% { transform: translateX(210%); opacity: 0; }
      }
      /* Somebody who has asked for less motion gets the plane parked on the
         runway rather than no loader at all - "something is happening" is the
         point, and a still plane still says it. */
      @media (prefers-reduced-motion: reduce) {
        #boot svg { animation: none; transform: translateX(180%); opacity: 1; }
      }
    </style>
    <div id="boot" role="status" aria-label="Loading Tryp.com">
      <div class="strip">
        <div class="line"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
        </svg>
      </div>
      <span class="label">Loading&#8230;</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
