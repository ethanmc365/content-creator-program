<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- THE CANVAS IS WHITE BEFORE ANYTHING ELSE IN THIS FILE IS READ.
         First rule in the document on purpose. Whatever the browser paints
         first - the root background during a reload, the overscroll gutter, the
         gap while the boot layer is still being parsed - is this colour, and it
         is the SAME colour as the boot layer and as the app behind it. That
         sameness is the whole point: the orange splash this replaced could not
         avoid a seam, because the document's own canvas is painted before any
         layer is, so a coloured layer over a differently-coloured canvas always
         has one frame where they disagree. See vite-boot-css.js for the other
         half of this, which is what stops the app opening UNSTYLED. -->
    <style>html { background: #ffffff; }</style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <!-- Mobile-first viewport. viewport-fit=cover handles iPhone notch/safe areas.

         `user-scalable=no, maximum-scale=1` DISABLES THE BROWSER'S OWN PINCH
         ZOOM. Ethan: "zoom in feature on mobile should not happen across the
         platform, only for certain things such as zooming in on the maps,
         zooming in on photos." Those two do their own zooming in JS now, at a
         quality browser zoom cannot reach - the map draws MORE map rather than
         bigger pixels - so what this removes is only the accidental version,
         which strands a chat thread at 1.3x with no way back.

         It is honoured in a standalone (home-screen) window and ignored by iOS
         Safari in a tab, which is why lib/pinchGuard exists as well. Neither is
         sufficient on its own. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta
      name="description"
      content="The official Tryp.com Content Creator Community. Create travel content, compete in challenges, earn cash and travel vouchers."
    />

    <!-- Social link preview (Open Graph + Twitter Card)

         COMMUNITY, NOT PROGRAM, AND THE CARD IS THE LOGO (4 Sep 2026).

         Ethan: "whenever you're sharing it there's that preview card that shows
         up - if you're sharing on Instagram for example. It currently shows
         Tryp.com Content Creator Program. Can you change that to just the
         Tryp.com logo there? And rename Tryp.com Content Creator Program as
         Tryp.com Content Creator Community."

         The old card carried the wordmark AND "Content Creator Program" set
         underneath it, so the name appeared twice in a preview that also prints
         the title as text beside it - three copies of the same words in one
         card. `og-image-v3.png` is the wordmark alone on the brand orange.

         THE FILENAME IS VERSIONED, and that is the point of it rather than
         tidiness: every scraper that has ever fetched this link - Instagram,
         WhatsApp, Slack, iMessage - has the old bytes cached against the old
         URL, some of them for weeks. Overwriting `og-image-v2.png` would leave
         the old card showing everywhere it already appears.

         The URLs point at `trypcreators.vercel.app`, which is the canonical
         origin (see lib/canonicalHost). The other origin still serves the app;
         it is just not the one to advertise. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tryp.com" />
    <meta property="og:title" content="Tryp.com Content Creator Community" />
    <meta property="og:description" content="The official Tryp.com Content Creator Community. Create travel content, compete in challenges, earn cash and travel vouchers." />
    <meta property="og:url" content="https://trypcreators.vercel.app" />
    <meta property="og:image" content="https://trypcreators.vercel.app/og-image-v3.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tryp.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tryp.com Content Creator Community" />
    <meta name="twitter:description" content="Create travel content, compete in challenges, earn cash and travel vouchers." />
    <meta name="twitter:image" content="https://trypcreators.vercel.app/og-image-v3.png" />

    <!-- Add to Home Screen (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#d94407" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v4.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tryp.com" />

    <!-- THE WORLD MAP, FETCHED BEFORE ANYTHING ASKS FOR IT.
         Six pages carry a map and all of them defer the map's mount until it is
         nearly on screen, which is right for the render and wrong for the
         download - the file only started moving once a reader was already
         looking at where it should be. `prefetch` is the low-priority hint:
         the browser takes it when the network is otherwise idle, so it never
         competes with the bundle or the first queries, and by the time anybody
         scrolls to a map it is a cache hit. See lib/mapCountries.

         NO `crossorigin` ATTRIBUTE. It is same-origin, and adding it would make
         the prefetch a CORS request while `loadMapFeatures` does a plain
         same-origin `fetch` - two different cache keys for the same URL, so the
         prefetched copy would never be used and the file would be downloaded
         twice. -->
    <link rel="prefetch" href="/geo/countries-50m.json" as="fetch" />

    <title>Tryp.com Creator Community</title>
  </head>
  <body>
    <!-- THE FIRST FRAME IS THE LOADER THE APP ITSELF DRAWS.
         Everything below this line is inline on purpose. Between the browser
         painting the document and React mounting there is a gap - the bundle
         has to arrive and parse - and for that gap `#root` is empty.

         THIS IS A COPY OF `PlaneLoader` (components/ui), DELIBERATELY, DOWN TO
         THE NUMBERS. A full-orange splash was tried and rejected: it flashed
         white, then orange, then the app, because three different surfaces
         (the document canvas, the splash layer, the app) were three different
         colours and the browser paints them at three different moments. Ethan:
         "it still flashes white and then orange... just revert it to what
         originally was, the white screen with one animated icon showing that
         it's loading." So there is now ONE look, drawn twice - once here in
         plain HTML for the gap, once by React afterwards - and the handover
         between them is invisible because there is nothing to hand over.

         KEEP THE TWO IN STEP. 112px strip (w-28), 32px tall (h-8), a 24px
         plane (h-6 w-6) on a 2px dashed line at 25% brand, `fly` at 1.7s
         ease-in-out with the exact -130%/210% travel from tailwind.config.
         If PlaneLoader changes, change this.

         It cannot be an external stylesheet or a script: this has to be
         paintable from the HTML alone, on the very first frame, with nothing
         fetched. It is removed by main.jsx once React has rendered. -->
    <style>
      /* THE FIRST FRAME IS THE SHAPE OF THE APP, NOT A LOADING SCREEN.

         Ethan, for the sixth time and this time about the installed app: "I'm
         still having the issue where it flashes up the loading screen between
         clicks. I don't want a loading screen, only the skeleton layout
         loading."

         Every loader INSIDE the app is a skeleton now (see lib/pageCache and
         components/PageSkeleton), and this was the last screen in the product
         that was not: a white page with a flying plane and the word "Loading".
         It matters far more on the home-screen app than in a browser, because
         iOS kills a backgrounded PWA aggressively - so what is a rare cold boot
         on a laptop is something a creator meets several times an hour on a
         phone, in between doing other things, which is exactly what "between
         clicks" describes.

         So this draws the SHELL: the header bar, a page of card shapes, and the
         bottom tab strip, in the same greys and with the same shimmer as
         `.skeleton` in index.css. The app then renders its own skeleton in the
         same places and hands over to real content, and there is no third
         screen anywhere in the sequence.

         It cannot be an external stylesheet or a script: this has to be
         paintable from the HTML alone, on the very first frame, with nothing
         fetched. It is removed by main.jsx once React has something to show.
         IF PageSkeleton'S SHAPES CHANGE, CHANGE THIS. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
        /* The fade out. `visibility` rides along so the layer stops taking
           presses the instant it starts leaving, rather than 420ms later.
           NO SCALE, and no colour change: the layer is the same white as the
           page under it, so all that is left to do is stop being there. */
        transition: opacity 300ms ease-out, visibility 300ms ease-out;
      }
      #boot.gone { opacity: 0; visibility: hidden; }

      /* One grey block. `--b-r` is its radius so a row of them can vary. */
      #boot i {
        display: block;
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        background: #F4F4F5;
      }
      #boot i::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        animation: boot-shimmer 1.6s ease-in-out infinite;
      }
      @keyframes boot-shimmer { 100% { transform: translateX(100%); } }

      /* The header: a logo block on the left, two round controls on the right.
         64px tall and a hairline underneath, which is what AppLayout draws. */
      #boot .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: 64px;
        padding: 0 20px;
        border-bottom: 1px solid #F3F4F6;
        flex: 0 0 auto;
      }
      #boot .bar .logo { width: 84px; height: 34px; border-radius: 10px; }
      #boot .bar .side { display: flex; align-items: center; gap: 10px; }
      #boot .bar .side i { width: 34px; height: 34px; border-radius: 999px; }

      /* The page. A heading, a wide card, then two rows - the shape every one
         of PageSkeleton's layouts starts with. */
      #boot .page {
        flex: 1 1 auto;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 20px 0;
        box-sizing: border-box;
      }
      #boot .page .h1 { width: 190px; height: 32px; border-radius: 10px; }
      #boot .page .h2 { width: 260px; max-width: 70%; height: 16px; margin-top: 12px; }
      #boot .page .hero { width: 100%; height: 132px; border-radius: 20px; margin-top: 26px; }
      #boot .page .row { width: 100%; height: 68px; border-radius: 16px; margin-top: 12px; }
      #boot .page .row.b { width: 92%; }

      /* The bottom tab strip, phone only - five items above the home indicator. */
      #boot .tabs {
        display: flex;
        justify-content: space-around;
        align-items: center;
        gap: 4px;
        padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid #F3F4F6;
        flex: 0 0 auto;
      }
      #boot .tabs i { width: 26px; height: 26px; border-radius: 9px; }
      @media (min-width: 1024px) {
        #boot .tabs { display: none; }
        #boot .page { padding-top: 36px; }
      }

      /* Somebody who has asked for less motion gets the shapes without the
         sweep - "something is happening" is carried by the layout itself. */
      @media (prefers-reduced-motion: reduce) {
        #boot i::after { animation: none; }
      }

      /* Dark mode: the same shapes on the app's own dark canvas, or the layer
         is a white flash in front of a dark app. */
      @media (prefers-color-scheme: dark) {
        html[data-theme='dark'] #boot { background: #141416; }
        html[data-theme='dark'] #boot i { background: #232326; }
        html[data-theme='dark'] #boot .bar,
        html[data-theme='dark'] #boot .tabs { border-color: #232326; }
      }
    </style>
    <div id="boot" role="status" aria-label="Loading Tryp.com">
      <div class="bar">
        <i class="logo"></i>
        <span class="side"><i></i><i></i></span>
      </div>
      <div class="page">
        <i class="h1"></i>
        <i class="h2"></i>
        <i class="hero"></i>
        <i class="row"></i>
        <i class="row b"></i>
        <i class="row"></i>
      </div>
      <div class="tabs">
        <i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
